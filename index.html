<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дөрвөн Бэрх - Монгол Уламжлалт Тоглоом</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Дөрвөн Бэрх</h1>
        <div id="shagai-field">
            <!-- Дөрвөн шагай энд гарч ирнэ -->
            <div class="shagai" id="s1"></div>
            <div class="shagai" id="s2"></div>
            <div class="shagai" id="s3"></div>
            <div class="shagai" id="s4"></div>
        </div>
        <button id="throw-btn" onclick="throwShagai()">Шагай орхих</button>
        <div class="result-area">
            <h2 id="result-text">Амжилт хүсье!</h2>
            <p id="symbol-text"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
