<!DOCTYPE html>
<html lang="mn">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дөрвөн Бэрх Буулгацгаая</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <h1>Дөрвөн бэрх буулгацгаая!</h1>
        
        <div id="shagai-container">
            <img src="honi.png" class="shagai" id="s1">
            <img src="mori.png" class="shagai" id="s2">
            <img src="temee.png" class="shagai" id="s3">
            <img src="yamaa.png" class="shagai" id="s4">
        </div>
        
        <div id="result-box">
            <p id="result-text">Шагайгаа орхиж хийморио үзээрэй!</p>
        </div>
        
        <button id="roll-button" onclick="rollShagai()">Шагай орхих</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
