<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дөрвөн Бэрх</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <h1>Дөрвөн Бэрх</h1>
        
        <div class="shagai-ring" id="shagai-field">
            <div class="shagai" id="s1"></div>
            <div class="shagai" id="s2"></div>
            <div class="shagai" id="s3"></div>
            <div class="shagai" id="s4"></div>
        </div>

        <button id="throw-btn" onclick="throwShagai()">Шагай орхих</button>
        <div id="result">Аз хийморио үзээрэй!</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
<div id="game-container">
    <div id="shagai-container">
        <img src="images/sheep.png" class="shagai" id="shagai1">
        <img src="images/goat.png" class="shagai" id="shagai2">
        <img src="images/camel.png" class="shagai" id="shagai3">
        <img src="images/horse.png" class="shagai" id="shagai4">
    </div>

    <button onclick="rollShagai()">Шидэх</button>
</div>
