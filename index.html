<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дөрвөн бэрх - Шагай тоглоом</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1 class="game-title">Дөрвөн бэрх буулгацгаая</h1>

        <audio id="bgMusic" loop>
            <source src="Морин хуур Монгол.mp3" type="audio/mpeg">
        </audio>

        <div class="shagai-circle" id="shagai-container">
            </div>

        <div class="controls">
            <button onclick="rollShagai()" class="action-btn">Орхих</button>
            <button onclick="toggleMusic()" class="music-btn">🎵 Ая асаах/унтраах</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
